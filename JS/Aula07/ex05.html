<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETRAN</title>
</head>
<body>
    <h1>Sistema de Multas</h1>
    <p>Velocidade do carro <input type="number" name="vel" id="ivel"> Km/h
    <input type="button" value="Testar" onclick="calcular()"></p>
    <p id="res">resutado</p>
    <script>
        function calcular() {
            var vel = document.getElementById('ivel')
            var res = document.querySelector('#res')
            vel = Number(vel.value)
            res.innerHTML = `<p>Sua velocidade atual é <strong>${vel}Kmh</strong></pS>`
            if (vel > 60) {
                res.innerHTML += 'Voce ultrapassou o limite, MULTADO' 
            } else {
                res.innerHTML += 'Dirija com moderação'
            }
            res.innerHTML += '<p>Use o sinto de segurança</p>'
        }
    </script>
</body>
</html>
