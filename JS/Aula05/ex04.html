<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando numeros</title>
</head>
<body>
    <h1>Soma aqui</h1>
    <input type="number" name="num1" id="inum1" max="5" min="5"> +
    <input type="number" name="num2" id="inum2" max="5" min="5">
    <input type="button" value="somar" onclick="somar()">
    <h3 id="res">Resultado</h3>
    <script>
        function somar() {
            var num1 = window.document.getElementById('inum1')
            var num2 = window.document.querySelector('input#inum2')
            var res = document.getElementById('res')
            var n1 = Number(num1.value)
            var n2 = Number(num2.value)
            var n3 = n1 + n2
            res.innerHTML = `A soma de ${n1} e ${n2} é <strong>${n3}</strong>`
        }
    </script>
</body>
</html>
